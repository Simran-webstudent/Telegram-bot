# fly.toml app configuration file generated for telegram-bot-k7-bka on 2026-11-01T08:33:42Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'telegram-bot-k7-bka'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[restart]]
  policy = 'always'
  processes = ['app']
  retries = 10
